# .github/workflows/build-cef-android.yml
# ============================================================
# 此工作流已禁用 — 不在 GitHub Actions 编译完整 CEF/Chromium
# ============================================================
#
# 失败原因（2026-08-25 验证）：
#   1. 磁盘空间不足：Chromium 源码需要 100GB+，免费 runner 仅 14GB SSD
#      → 在 gclient sync 阶段报错: OSError: [Errno 28] No space left on device
#   2. 内存不足：编译需要 32GB+ RAM，免费 runner 仅 16GB
#      → 编译阶段必定 OOM (Out of Memory)
#   3. 超时限制：完整编译需 6+ 小时，超过 Actions 6 小时超时
#   4. GitHub 付费 larger runner (32-core, 64GB) 单次费用约 $40-50
#      且编译出的 libcef.so 还面临 Activity 依赖、子进程模型等不可绕过的技术死胡同
#
# 结论：原生 CEF 移植在普通手机 FCL 上几乎不可实现。
# 完整分析见 docs/CEF-PORT-FEASIBILITY.md
#
# 如需自行编译 CEF，请使用自建大内存 Linux 服务器（64GB RAM, 200GB SSD）。
#
# 此文件保留为参考，不执行任何 job。
# 要重新启用：取消下方 job 的注释并移除 `if: false`
name: Build CEF Android (DISABLED)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '确认：此构建在免费 runner 上必定失败'
        required: true
        default: '我已阅读文档，知道会失败'

jobs:
  build-cef:
    if: false  # 永远不执行
    runs-on: ubuntu-latest
    steps:
      - name: 此 Job 已禁用
        run: |
          echo "此工作流已禁用。"
          echo "原因：GitHub 免费 runner 无法编译 Chromium（磁盘/内存/超时限制）"
          echo "如需编译 CEF，请使用自建大内存 Linux 服务器（64GB RAM, 200GB SSD）"
          echo "完整分析见 docs/CEF-PORT-FEASIBILITY.md"
          exit 1
