# .github/workflows/build-mcef-mod.yml
name: Build MCEF Android Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcef-android/**'
      - '.github/workflows/build-mcef-mod.yml'

jobs:
  build-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for MCEF source
        id: check-src
        run: |
          if [ ! -f "mcef-android/build.gradle" ] && [ ! -f "mcef-android/settings.gradle" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::mcef-android 目录尚无构建文件，将尝试克隆上游 MCEF 源码"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone MCEF upstream (if needed)
        if: steps.check-src.outputs.skip == 'true'
        run: |
          echo "::notice::正在克隆上游 MCEF 源码（含 java-cef 子模块）..."
          rm -rf mcef-android
          git clone --depth 1 https://github.com/CinemaMod/mcef.git mcef-android || {
            echo "::error::无法克隆上游 MCEF 仓库"
            exit 1
          }
          cd mcef-android
          # 初始化 java-cef 子模块（cloneJcef 任务依赖此操作）
          git submodule update --init --recursive --depth 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Generate Gradle Wrapper (if missing)
        working-directory: mcef-android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.12 --distribution-type bin
          fi

      - name: Build Fabric mod
        working-directory: mcef-android
        run: ./gradlew build --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcef-android-fabric
          path: mcef-android/**/build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
