# .github/workflows/build-mcef-mod.yml
name: Build MCEF Android Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'mcef-android/**'
      - '.github/workflows/build-mcef-mod.yml'

jobs:
  build-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clone java-cef submodule
        run: ./gradlew cloneJcef

      - name: Build Fabric mod
        run: ./gradlew :fabric:remapJar
        working-directory: mcef-android

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mcef-android-fabric
          path: mcef-android/fabric/build/libs/*.jar
          retention-days: 30
