# .github/workflows/build-proxy-web-mod.yml
name: Build Proxy Web Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'proxy-web-mod/**'
      - '.github/workflows/build-proxy-web-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build mod
        run: ./gradlew build
        working-directory: proxy-web-mod

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: proxy-web-mod
          path: proxy-web-mod/build/libs/*.jar
          retention-days: 30
