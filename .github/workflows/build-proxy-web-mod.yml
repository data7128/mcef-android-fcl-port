# .github/workflows/build-proxy-web-mod.yml
name: Build Proxy Web Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'proxy-web-mod/**'
      - '.github/workflows/build-proxy-web-mod.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle Wrapper
        working-directory: proxy-web-mod
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Build mod
        working-directory: proxy-web-mod
        run: ./gradlew build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-web-mod
          path: proxy-web-mod/build/libs/*.jar
          retention-days: 30
          if-no-files-found: warn
